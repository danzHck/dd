jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup RDP
        shell: powershell
        run: |
          $Password = "DanzK3ce!2026Rdp"
          $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force

          Set-LocalUser -Name "runneradmin" -Password $SecurePassword

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

          Write-Host "RDP configured."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          Invoke-WebRequest $url -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" `
            -Wait

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTH_KEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 5

          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

          Write-Host "===================================="
          Write-Host "             RDP READY"
          Write-Host "===================================="
          Write-Host "PC NAME  : $ip"
          Write-Host "USERNAME : runneradmin"
          Write-Host "PORT     : 3389"
          Write-Host "===================================="

      - name: Verify RDP
        shell: powershell
        run: |
          Test-NetConnection localhost -Port 3389

      - name: Keep Job Alive
        shell: powershell
        run: |
          Write-Host "Session active."

          while ($true) {
              Write-Host "RDP ACTIVE - $(Get-Date)"
              Start-Sleep -Seconds 60
          }
