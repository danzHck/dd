name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:

      # =========================
      # INSTALL TAILSCALE
      # =========================
      - name: Install Tailscale
        shell: powershell
        run: |
          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait

          Write-Host "Tailscale installed."


      # =========================
      # CONNECT TAILSCALE
      # =========================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          & $ts up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp"

          Start-Sleep -Seconds 5

          & $ts status


      # =========================
      # ENABLE RDP
      # =========================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force


      # =========================
      # SET PASSWORD
      # =========================
      - name: Set RDP Password
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString `
            "$env:RDP_PASSWORD" `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "runneradmin" `
            -Password $password


      # =========================
      # SHOW CONNECTION INFO
      # =========================
      - name: RDP Information
        shell: powershell
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $ts ip -4).Trim()

          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP READY"
          Write-Host "======================================"
          Write-Host "PC NAME  : $ip"
          Write-Host "USERNAME : runneradmin"
          Write-Host "PASSWORD : RDP_PASSWORD SECRET"
          Write-Host "PORT     : 3389"
          Write-Host "======================================"
          Write-Host ""

          Test-NetConnection `
            -ComputerName "localhost" `
            -Port 3389


      # =========================
      # KEEP RUNNING
      # =========================
      - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "RDP ACTIVE - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
